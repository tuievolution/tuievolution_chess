name: tuievolution_chess
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_launcher_icons: ^0.13.1
  
  # --- FRONTEND PAKETLERİ ---
  flutter_svg: ^2.2.4
  google_fonts: ^8.1.0
  graphview: ^1.5.1
  flutter_chess_board: ^1.0.1

  # --- BACKEND PAKETLERİ ---
  supabase_flutter: ^2.12.4  # Veritabanı ve kimlik doğrulama işlemleri için
  flutter_dotenv: ^6.0.1
  http: ^1.6.0
  stockfish: ^1.8.1
  chess: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Veri setini uygulamanın içine dahil ediyoruz
  assets:
    - .env

flutter_launcher_icons:
  android: false  # Paketin Android ikonlarını ellemesini/üretmesini tamamen yasaklar.
  ios: true       # Eğer iOS için o klasörleri (Assets.xcassets) Git'ten çekmediyseniz, iOS için üretmeye devam etsin.
  image_path: "assets/icon/ic_launcher.png" # Bu sadece iOS üretimi için referans olarak kalır.